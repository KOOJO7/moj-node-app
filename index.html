<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0c0b09">
<title>Wejście — lecimyszacunek.pl</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0c0b09;
    --ink: #f4efe4;
    --ink-dim: #9c9486;
    --ink-faint: #5b5548;
    --line: rgba(244,239,228,0.11);
    --gold: #c8953c;
    --gold-dim: rgba(200,149,60,0.14);
    --bad: #c1584a;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', -apple-system, sans-serif;
  }

  html { color-scheme: dark; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
  }

  .ember {
    position: fixed;
    top: 38%;
    left: 50%;
    width: 640px;
    height: 640px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(200,149,60,0.10) 0%, rgba(200,149,60,0.03) 45%, transparent 72%);
    pointer-events: none;
    z-index: 0;
  }

  .mark {
    position: fixed;
    top: 28px;
    left: 32px;
    display: flex;
    align-items: center;
    gap: 9px;
    text-decoration: none;
    color: var(--ink-dim);
    font-size: 13px;
    letter-spacing: 0.01em;
    z-index: 2;
  }
  .mark:hover { color: var(--ink); }
  .mark .chip {
    width: 7px; height: 7px;
    background: var(--gold);
    border-radius: 1.5px;
    flex-shrink: 0;
  }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
  }

  .kicker {
    font-size: 13px;
    color: var(--ink-dim);
    margin-bottom: 22px;
  }

  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 34px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin-bottom: 14px;
  }
  h1 em {
    font-style: italic;
    color: var(--gold);
  }

  .sub {
    font-size: 14px;
    color: var(--ink-dim);
    line-height: 1.65;
    margin-bottom: 40px;
    max-width: 34ch;
  }

  form { display: flex; flex-direction: column; gap: 6px; }

  label {
    font-size: 12.5px;
    color: var(--ink-faint);
  }

  .field-row {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 12px;
    transition: border-color 0.2s ease;
  }
  .field-row:focus-within { border-color: var(--gold); }

  input[type="password"] {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 20px;
    letter-spacing: 0.14em;
    padding: 6px 0 2px;
  }
  input[type="password"]::placeholder { color: var(--ink-faint); letter-spacing: 0.14em; }

  button.enter {
    margin-top: 28px;
    width: 100%;
    padding: 13px 18px;
    border: none;
    border-radius: 3px;
    background: var(--gold);
    color: #201603;
    font-family: var(--sans);
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  button.enter:hover { filter: brightness(1.08); }
  button.enter:active { transform: scale(0.99); }
  button.enter:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .error {
    font-size: 13px;
    color: var(--bad);
    margin-top: 14px;
    min-height: 1em;
    opacity: 0;
    transform: translateY(-2px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .error.show { opacity: 1; transform: translateY(0); }

  @media (max-width: 480px) {
    .mark { top: 20px; left: 20px; }
    h1 { font-size: 29px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="ember" aria-hidden="true"></div>

<a href="/home" class="mark"><span class="chip"></span>lecimyszacunek</a>

<main>
  <p class="kicker">Panel prywatny</p>
  <h1>Wpisz klucz,<br>żeby <em>wejść</em>.</h1>
  <p class="sub">Kapitał, cel dzienny i historia transakcji czekają za tym jednym polem.</p>

  <form id="loginForm" onsubmit="event.preventDefault(); login();">
    <label for="pass">Klucz dostępu</label>
    <div class="field-row">
      <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password" autofocus>
    </div>
    <button type="submit" class="enter">Zaloguj</button>
    <p class="error" id="error">Zły klucz — spróbuj jeszcze raz.</p>
  </form>
</main>

<script>
  async function login() {
    const passInput = document.getElementById('pass');
    const errorEl = document.getElementById('error');
    const pass = passInput.value;
    try {
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pass })
      });
      if (res.ok) {
        window.location.href = '/panel';
        return;
      }
      throw new Error();
    } catch (e) {
      errorEl.classList.add('show');
      passInput.value = '';
      passInput.focus();
      setTimeout(() => errorEl.classList.remove('show'), 3000);
    }
  }
</script>
</body>
</html>
